  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: 'Vazirmatn', 'Open Sans', sans-serif;
      display: flex;
      flex-direction: column;
    }

    /* Navbar & Footer */
    nav.navbar { flex-shrink: 0; }
    footer { flex-shrink: 0; }

    /* Main content area for loader */
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
      padding: 1rem;
    }

    /* Loader */
    .loader {
      width: 80px;
      height: 80px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .loader .cup {
      position: absolute;
      width: 25px;
      height: 18px;
      background-color: #fff;
      border: 1px solid #2e2e2e;
      border-radius: 2px 2px 10px 10px;
      animation: expansion 6s infinite ease-in-out;
      transform-origin: center;
    }

    .cup::after {
      content: "";
      position: absolute;
      top: -2px;
      width: calc(100% - 2px);
      height: 2px;
      background: #fed59fca;
      border: 1px solid #2e2e2ebe;
      border-radius: 50%;
    }

    .cup::before {
      content: "";
      position: absolute;
      top: 15px;
      width: calc(100% - 2px);
      height: 4px;
      background: transparent;
      border: 1px solid #2e2e2e;
      border-top: none;
      border-radius: 50%;
      z-index: -1;
    }

    .cup .cup-handle {
      position: absolute;
      width: 5px;
      height: 10px;
      background-color: #fff;
      border: 1px solid #2e2e2e;
      right: -5px;
      top: 2px;
      border-radius: 2px 10px 20px 2px;
    }

    .cup .smoke {
      position: absolute;
      bottom: 100%;
      left: 50%;
      width: 15px;
      height: 25px;
      background: rgba(107, 102, 102, 0.43);
      border-radius: 50%;
      transform: translateX(-50%);
      animation: rise 6s infinite ease-in-out;
      filter: blur(8px);
    }

    .cup .smoke.one { animation-delay: 0s; }
    .cup .smoke.two { animation-delay: 1s; }
    .cup .smoke.three { animation-delay: 2s; }

    .loader .load {
      position: absolute;
      font-size: 12px;
      opacity: 0.7;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      width: 100px;
    }

    @keyframes expansion {
      0%, 100% { width: 25px; transform: translateX(0); }
      40%, 90% { width: 100%; transform: translateX(0); }
      80% { width: 25px; transform: translateX(64px); }
    }

    @keyframes rise {
      0% { transform: translate(-50%, 0) scale(0.4); opacity: 0; }
      30% { opacity: 0.7; }
      60% { opacity: 0.4; }
      100% { transform: translate(-50%, -120px) scale(1); opacity: 0; }
    }

    footer a { color: #fff; text-decoration: underline; }

    /* Responsive adjustments */
    @media (max-width: 576px) {
      .loader { width: 60px; height: 60px; }
      .loader .load { font-size: 10px; top: 50px; width: 80px; }
    }
  </style>
