<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Upload & Replace Video</title>
</head>
<body>
  <h2>Upload News Video</h2>
  <p>This page is ONLY for Mr.Karimi.Plz,if you have acces to this site,DO NOT UPLOAD TROLS :(        </p>
     
  <form id="uploadForm">
    <input type="file" id="fileInput" accept="video/*" />
    <button type="submit">Upload</button>
  </form>
  <script>
const loader = document.createElement('div');
loader.id = 'pageLoader';
loader.style.cssText = `
  position: fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
`;

loader.innerHTML = `
<div class="main">
  <div class="up">
    <div class="loaders">
      ${'<div class="loader"></div>'.repeat(10)}
    </div>
    <div class="loadersB">
      ${Array.from({length:9}, (_,i)=>`<div class="loaderA"><div class="ball${i}"></div></div>`).join('')}
    </div>
  </div>
</div>
`;

const style = document.createElement('style');
style.innerHTML = `
.main { display:flex; align-items:center; justify-content:center; }
.loaders, .loadersB { display:flex; align-items:center; justify-content:center; }
.loader { position:absolute; width:1.15em; height:13em; border-radius:50px; background:#e0e0e0; }
.loader:after { content:""; position:absolute; left:0; top:0; width:1.15em; height:5em; background:#e0e0e0; border-radius:50px; border:1px solid #e2e2e2; box-shadow: inset 5px 5px 15px #d3d2d2ab, inset -5px -5px 15px #e9e9e9ab; mask-image: linear-gradient(to bottom, black calc(100% - 48px), transparent 100%); }
.loader::before { content:""; position:absolute; bottom:0; right:0; width:1.15em; height:4.5em; background:#e0e0e0; border-radius:50px; border:1px solid #e2e2e2; box-shadow: inset 5px 5px 15px #d3d2d2ab, inset -5px -5px 15px #e9e9e9ab; mask-image: linear-gradient(to top, black calc(100% - 48px), transparent 100%); }
.loaderA { position:absolute; width:1.15em; height:13em; border-radius:50px; background:transparent; }
${Array.from({length:9}, (_,i)=>`.ball${i} { width:1.15em; height:1.15em; box-shadow: rgba(0,0,0,0.17) 0 -10px 10px 0 inset, rgba(0,0,0,0.15) 0 -15px 15px 0 inset, rgba(0,0,0,0.1) 0 -40px 20px 0 inset, rgba(0,0,0,0.06) 0 2px 1px, rgba(0,0,0,0.09) 0 4px 2px, rgba(0,0,0,0.09) 0 8px 4px, rgba(0,0,0,0.09) 0 16px 8px, rgba(0,0,0,0.09) 0 32px 16px, 0 -1px 15px -8px rgba(0,0,0,0.09); border-radius:50%; transition:transform 800ms cubic-bezier(1,-0.4,0,1.4); background-color:rgba(232,232,232,1); animation:3.63s move ease-in-out infinite; animation-delay:${i*0.2}s; }`).join('\n')}
@keyframes move { 0% { transform:translateY(0em);} 50% { transform:translateY(12em);} 100% { transform:translateY(0em);} }
`;

document.head.appendChild(style);
document.body.appendChild(loader);

window.addEventListener('load', () => loader.remove());

  </script>
  <script>
     const password = "AMK-Pass-1404";
    const userPass = prompt("Enter password to access upload page:");

    if (userPass === password) {
      document.getElementById("uploadForm").style.display = "block";
      alert("Access granted!");
    } else {
      alert("Wrong password! Access denied.");
      document.body.innerHTML = "<h2>Access denied</h2>";
    }

    const token = "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";
    const username = "NP-2024-Git";
    const repo = "AMK";
    const branch = "V4.4";
    const filePath = "Videos/Videos/Khabar.mp4";

    async function getFileSHA() {
      const res = await fetch(
        `https://api.github.com/repos/${username}/${repo}/contents/${filePath}?ref=${branch}`,
        {
          headers: { Authorization: `Bearer ${token}` }
        }
      );
      const data = await res.json();
      return data.sha; 
    }

    document.getElementById("uploadForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const file = document.getElementById("fileInput").files[0];
      if (!file) return alert("Please select a file");

      const reader = new FileReader();
      reader.onload = async () => {
        try {
          const content = btoa(
            new Uint8Array(reader.result)
              .reduce((data, byte) => data + String.fromCharCode(byte), "")
          );

          const sha = await getFileSHA();

          const uploadRes = await fetch(
            `https://api.github.com/repos/${username}/${repo}/contents/${filePath}`,
            {
              method: "PUT",
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                message: "Replace Khabar.mp4 via upload page",
                content: content,
                sha: sha,
                branch: branch
              })
            }
          );

          if (uploadRes.ok) {
            alert("Upload successful! Khabar.mp4 replaced.");
          } else {
            alert("Upload failed.");
            console.log(await uploadRes.text());
          }
        } catch (err) {
          console.error(err);
          alert("Error uploading file.");
        }
      };

      reader.readAsArrayBuffer(file);
    });
  </script>
</body>
</html>
