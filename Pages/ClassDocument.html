<script>
const PngLinks = {
  "701": "../Images/701.jpg",
  "702": "../Images/702.jpg",
  "801": "../Images/801.jpg",
  "802": "../Images/802.jpg",
  "901": "../Images/901.jpg",
  "902": "../Images/902.jpg"
};

document.getElementById('classForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const selectedClass = document.getElementById('ClassSelect').value;
  const resultDiv = document.getElementById('result');

  if (!selectedClass) {
    resultDiv.innerHTML = `<p>لطفا یک گزینه‌ را انتخاب کنید.</p>`;
    return;
  }

  const link = PngLinks[selectedClass];
  if (!link) {
    resultDiv.innerHTML = `<p>برنامه برای این کلاس موجود نیست.</p>`;
    return;
  }

  resultDiv.innerHTML = `<img src="${link}" alt="برنامه کلاسی کلاس ${selectedClass}">`;
});

</script>
